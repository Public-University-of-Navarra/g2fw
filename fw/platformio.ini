; g2fw firmware: ESP32-DevKitC-32E of the drone PCB (see fw/README.md).
; Build: pio run -e esp32    Upload + serial monitor: pio run -e esp32 -t upload -t monitor

[env:esp32]
; Pinned version (Arduino-ESP32 core 3.3.12), so every laptop and CI build the same thing.
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
; Libraries of the real drivers (step 6), same versions validated on 19/11. Only this file
; declares them, so the step-6 PRs never touch it.
lib_deps =
    adafruit/Adafruit MCP9808 Library @ 2.0.2
    sparkfun/SparkFun 6DoF LSM6DSV16X @ 1.0.2
    sparkfun/SparkFun LPS28DFW Arduino Library @ 1.0.0
    pololu/VL53L1X @ 1.3.1
    stm32duino/STM32duino VL53L8CX @ 2.1.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Firmware version from git tags (FW_VERSION), see scripts/version.py.
extra_scripts = pre:scripts/version.py
