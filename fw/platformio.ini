; g2fw firmware: ESP32-DevKitC-32E of the drone PCB (see fw/README.md).
; Build: pio run -e esp32    Upload + serial monitor: pio run -e esp32 -t upload -t monitor

[env:esp32]
; Pinned version (Arduino-ESP32 core 3.3.12), so every laptop and CI build the same thing.
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
