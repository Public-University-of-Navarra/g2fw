# Boot: the firmware prints its version and then the banner, the last line of setup()
# (contract, fw/README.md, "Serial format").
name: Boot banner
version: 1
author: g2fw

steps:
  - name: Version line (the number comes from git, so only the prefix is checked)
    wait-serial: '[fw] name=g2fw version='
  - name: Banner
    wait-serial: 'FPF-LAB READY'
